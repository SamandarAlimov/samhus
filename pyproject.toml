[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samhus-prototype"
version = "0.0.8"
description = "Experimental Samhus language interpreter, bytecode compiler and VM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Alsamos"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]
# License intentionally unspecified pending owner's explicit decision.

[project.scripts]
samhus = "samhus.__main__:main"

[tool.setuptools.packages.find]
include = ["samhus*"]
