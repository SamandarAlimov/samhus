name: Samhus prototype tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python bootstrap
        run: python -m compileall -q samhus
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Type-check annotated example
        run: python -m samhus typecheck examples/typed.sahu
      - name: Run annotated example
        run: python -m samhus run examples/typed.sahu --typecheck
      - name: Check deterministic formatter
        run: python -m samhus fmt examples/typed.sahu
      - name: Dump abstract syntax tree
        run: python -m samhus ast examples/typed.sahu
      - name: Run hello world
        run: python -m samhus run examples/hello.sahu
      - name: Run function example
        run: python -m samhus run examples/functions.sahu
      - name: Check syntax
        run: python -m samhus check examples/basics.sahu
