name: Samhus prototype validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python prototype
        run: python -m compileall -q samhus scripts
      - name: Run all regression and differential tests
        run: python -m unittest discover -s tests -v
      - name: Install local CLI package
        run: python -m pip install -e .
      - name: Validate installed samhus CLI
        run: samhus --version
      - name: Run tree backend
        run: python -m samhus run examples/functions.sahu
      - name: Run bytecode VM backend
        run: python -m samhus run examples/functions.sahu --backend vm
      - name: Run typed VM program
        run: python -m samhus run examples/typed.sahu --typecheck --backend vm
      - name: Check typed program
        run: python -m samhus typecheck examples/typed.sahu
      - name: Run experimental AI JSON validation on tree backend
        run: python -m samhus run examples/ai_validation.sahu --backend tree --typecheck
      - name: Run experimental AI JSON validation on VM backend
        run: python -m samhus run examples/ai_validation.sahu --backend vm --typecheck
      - name: Check List sample types
        run: python -m samhus typecheck examples/lists.sahu
      - name: Run List sample with tree backend
        run: python -m samhus run examples/lists.sahu --backend tree --typecheck
      - name: Run List sample with VM backend
        run: python -m samhus run examples/lists.sahu --backend vm --typecheck
      - name: Typecheck Maps and JSON example
        run: python -m samhus typecheck examples/maps_json.sahu
      - name: Execute Maps and JSON on tree backend
        run: python -m samhus run examples/maps_json.sahu --backend tree --typecheck
      - name: Execute Maps and JSON on VM backend
        run: python -m samhus run examples/maps_json.sahu --backend vm --typecheck
      - name: Typecheck Float Null example
        run: python -m samhus typecheck examples/float_null.sahu
      - name: Run Float Null with tree backend
        run: python -m samhus run examples/float_null.sahu --backend tree --typecheck
      - name: Run Float Null with VM backend
        run: python -m samhus run examples/float_null.sahu --backend vm --typecheck
      - name: Export Float Null AST
        run: python -m samhus ast examples/float_null.sahu
      - name: Typecheck Decimal and Result example
        run: python -m samhus typecheck examples/decimal_result.sahu
      - name: Run Decimal and Result on tree
        run: python -m samhus run examples/decimal_result.sahu --backend tree --typecheck
      - name: Run Decimal and Result on VM
        run: python -m samhus run examples/decimal_result.sahu --backend vm --typecheck
      - name: Typecheck multi-file example
        run: python -m samhus typecheck examples/modules/main.sahu
      - name: Execute multi-file example on tree
        run: python -m samhus run examples/modules/main.sahu --backend tree --typecheck
      - name: Execute multi-file example on VM
        run: python -m samhus run examples/modules/main.sahu --backend vm --typecheck
      - name: Generate multi-file native C source
        run: python -m samhus emit-c examples/modules/native_main.sahu
      - name: Inspect Value IR and PHI joins
        run: python -m samhus ir examples/short_circuit_values.sahu --values
      - name: Inspect optimized Value IR
        run: python -m samhus ir examples/short_circuit_values.sahu --values --optimize
      - name: Execute PHI example on VM
        run: python -m samhus run examples/short_circuit_values.sahu --backend vm --typecheck
      - name: Inspect optimized IR
        run: python -m samhus ir examples/control_flow_ir.sahu --optimize
      - name: Execute optimized IR sample
        run: python -m samhus run examples/control_flow_ir.sahu --backend ir --optimize --typecheck
      - name: Execute optimized multi-file IR
        run: python -m samhus run examples/modules/main.sahu --backend ir --optimize --typecheck
      - name: Inspect typed flow IR
        run: python -m samhus ir examples/control_flow_ir.sahu --types
      - name: Inspect typed multi-file IR
        run: python -m samhus ir examples/modules/main.sahu --types
      - name: Inspect validated control flow IR
        run: python -m samhus ir examples/control_flow_ir.sahu
      - name: Execute IR lowered example
        run: python -m samhus run examples/control_flow_ir.sahu --backend ir --typecheck
      - name: Execute multi-file IR backend
        run: python -m samhus run examples/modules/main.sahu --backend ir --typecheck
      - name: Disassemble compiled program
        run: python -m samhus disasm examples/typed.sahu
      - name: Check AST serializer
        run: python -m samhus ast examples/typed.sahu
      - name: Compile and run native executable
        run: python scripts/native_smoke.py
      - name: Run smoke benchmark
        run: python scripts/benchmark.py --repeat 1
